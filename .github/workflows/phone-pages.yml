name: Phone PWA

on:
  push:
    branches: [main, master]
    paths:
      - "opus/phone/ui/**"
      - "opus/phone/util.py"
      - "opus/ui/icons.py"
      - ".github/workflows/phone-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate phone icons
        run: |
          pip install pillow
          python -c "from opus.phone.util import ensure_phone_icons; ensure_phone_icons()"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: opus/phone/ui
      - id: deploy
        uses: actions/deploy-pages@v4
